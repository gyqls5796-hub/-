<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>동물 & 공룡 서식지 탐험</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; }
    body { margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; text-align: center; }
    .screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .btn-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; z-index: 10; }
    .game-btn { font-size: 1.8rem; padding: 18px 36px; border: none; border-radius: 20px; cursor: pointer; background: #ffe066; font-weight: bold; box-shadow: 0 6px #d4a000; }
    .game-btn:active { transform: translateY(4px); box-shadow: 0 2px #d4a000; }
    canvas { display: block; }
    
    #backBtn { position: absolute; top: 15px; left: 15px; z-index: 50; font-size: 1.1rem; padding: 10px 18px; border-radius: 12px; border: none; background: rgba(255,255,255,0.95); font-weight: bold; cursor: pointer; display: none; box-shadow: 0 3px 6px rgba(0,0,0,0.3); }

    /* 3x3 드래그 퍼즐 창 */
    #puzzleOverlay { display: none; background: rgba(0, 0, 0, 0.92); color: white; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    
    #closePuzzleBtn {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.2rem;
      padding: 8px 18px;
      border-radius: 20px;
      border: none;
      background: #ff4757;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
    }
    #closePuzzleBtn:active { transform: scale(0.95); }

    .puzzle-header h2 { font-size: 2.2rem; margin: 0 0 5px 0; color: #fbc531; }
    .puzzle-header p { font-size: 1.1rem; margin: 0 0 15px 0; color: #dcdde1; }
    
    #puzzleBoard {
      width: 306px;
      height: 306px;
      position: relative;
      background: #2f3640;
      border: 4px solid #fbc531;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      touch-action: none;
    }
    
    .tile {
      width: 100px;
      height: 100px;
      position: absolute;
      background-size: 300px 300px;
      background-repeat: no-repeat;
      border-radius: 6px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      cursor: grab;
      transition: transform 0.15s ease, left 0.15s ease, top 0.15s ease;
      touch-action: none;
    }
    .tile.dragging {
      cursor: grabbing;
      z-index: 999 !important;
      transform: scale(1.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transition: none !important;
    }
    #puzzleCompleteMsg {
      font-size: 1.8rem;
      color: #2ed573;
      font-weight: bold;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <button id="backBtn" onclick="goToStart()">🏠 처음으로</button>

  <!-- 1단계: 육지 / 바다 선택 -->
  <div id="screen1" class="screen" style="background: linear-gradient(135deg, #74b9ff, #55efc4);">
    <h1 style="font-size: 2.3rem; color: #2d3436; margin-bottom: 30px;">어디로 탐험을 떠날까?</h1>
    <div class="btn-container">
      <button class="game-btn" onclick="selectTerrain('land')">🏞️ 넓은 육지</button>
      <button class="game-btn" onclick="selectTerrain('sea')">🌊 푸른 바다</button>
    </div>
  </div>

  <!-- 2단계: 동물 / 공룡 선택 -->
  <div id="screen2" class="screen" style="background: linear-gradient(135deg, #ffeaa7, #fab1a0); display: none;">
    <h1 style="font-size: 2.3rem; color: #2d3436; margin-bottom: 30px;">누구를 만나러 갈까?</h1>
    <div class="btn-container">
      <button class="game-btn" onclick="selectCategory('animal')">🦁 실제 동물</button>
      <button class="game-btn" onclick="selectCategory('dino')">🦖 거대 공룡</button>
    </div>
  </div>

  <!-- 3단계: 서식지 캔버스 화면 -->
  <canvas id="gameCanvas" style="display: none;"></canvas>

  <!-- 4단계: 3x3 드래그 퍼즐 창 -->
  <div id="puzzleOverlay" class="screen">
    <button id="closePuzzleBtn" onclick="closePuzzle()">✕ 닫기</button>
    <div class="puzzle-header">
      <h2 id="puzzleTitle">동물 이름</h2>
      <p id="puzzleSubtitle">조각을 손가락으로 끌어서 제자리에 맞춰보세요!</p>
    </div>
    <div id="puzzleBoard"></div>
    <div id="puzzleCompleteMsg">🎉 완성! 참 잘했어요! 🎉</div>
  </div>

  <script>
    let terrain = '', category = '';
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let entities = [];
    let habitats = [];
    let currentSelected = null;
    let animId = null;

    // --- 외부 이미지 없이 100% 로딩되는 고해상도 자체 아트 생성기 ---
    const generatedImages = {};
    const generatedDataUrls = {};

    function generateRealArtwork(key) {
      const off = document.createElement('canvas');
      off.width = 300;
      off.height = 300;
      const g = off.getContext('2d');

      // 배경 및 사실적 동물 일러스트 렌더링
      if (key === 'lion') {
        // 사자
        g.fillStyle = '#b8860b'; g.fillRect(0, 0, 300, 300);
        // 갈기
        g.fillStyle = '#5c2c16';
        g.beginPath(); g.arc(150, 150, 125, 0, Math.PI*2); g.fill();
        for(let i=0; i<24; i++) {
          const ang = (i / 24) * Math.PI * 2;
          g.fillStyle = i%2===0 ? '#3e1a07' : '#7c3f1d';
          g.beginPath();
          g.arc(150 + Math.cos(ang)*110, 150 + Math.sin(ang)*110, 30, 0, Math.PI*2);
          g.fill();
        }
        // 얼굴
        g.fillStyle = '#e5a65d';
        g.beginPath(); g.ellipse(150, 155, 75, 65, 0, 0, Math.PI*2); g.fill();
        // 주둥이
        g.fillStyle = '#f7dfbe';
        g.beginPath(); g.ellipse(150, 185, 40, 30, 0, 0, Math.PI*2); g.fill();
        // 코 & 입
        g.fillStyle = '#2c1d11';
        g.beginPath(); g.moveTo(140, 168); g.lineTo(160, 168); g.lineTo(150, 180); g.closePath(); g.fill();
        g.lineWidth = 3; g.strokeStyle = '#2c1d11';
        g.beginPath(); g.moveTo(150, 180); g.lineTo(150, 195); g.stroke();
        // 눈
        g.fillStyle = '#f39c12';
        g.beginPath(); g.arc(120, 140, 12, 0, Math.PI*2); g.arc(180, 140, 12, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000';
        g.beginPath(); g.arc(120, 140, 7, 0, Math.PI*2); g.arc(180, 140, 7, 0, Math.PI*2); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(118, 137, 3, 0, Math.PI*2); g.arc(178, 137, 3, 0, Math.PI*2); g.fill();
      } else if (key === 'giraffe') {
        // 기린
        g.fillStyle = '#87ceeb'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#f5c542';
        g.beginPath(); g.rect(120, 110, 60, 190); g.fill(); // 목
        g.beginPath(); g.ellipse(150, 110, 45, 60, 0, 0, Math.PI*2); g.fill(); // 머리
        // 무늬
        g.fillStyle = '#a0522d';
        g.beginPath(); g.roundRect(130, 140, 40, 35, 10); g.fill();
        g.beginPath(); g.roundRect(125, 190, 50, 40, 12); g.fill();
        g.beginPath(); g.roundRect(130, 245, 40, 45, 10); g.fill();
        // 뿔
        g.fillStyle = '#8b4513';
        g.lineWidth = 6; g.strokeStyle = '#8b4513';
        g.beginPath(); g.moveTo(135, 65); g.lineTo(135, 40); g.stroke();
        g.beginPath(); g.moveTo(165, 65); g.lineTo(165, 40); g.stroke();
        g.beginPath(); g.arc(135, 38, 8, 0, Math.PI*2); g.arc(165, 38, 8, 0, Math.PI*2); g.fill();
        // 눈 & 코
        g.fillStyle = '#222';
        g.beginPath(); g.arc(130, 95, 8, 0, Math.PI*2); g.arc(170, 95, 8, 0, Math.PI*2); g.fill();
        g.fillStyle = '#4a2c11';
        g.beginPath(); g.ellipse(150, 140, 30, 20, 0, 0, Math.PI*2); g.fill();
      } else if (key === 'monkey') {
        // 원숭이
        g.fillStyle = '#27ae60'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#6d4c41';
        g.beginPath(); g.arc(80, 140, 35, 0, Math.PI*2); g.arc(220, 140, 35, 0, Math.PI*2); g.fill(); // 귀
        g.beginPath(); g.arc(150, 150, 85, 0, Math.PI*2); g.fill(); // 얼굴 외곽
        g.fillStyle = '#d7ccc8';
        g.beginPath(); g.arc(125, 135, 40, 0, Math.PI*2); g.arc(175, 135, 40, 0, Math.PI*2); g.fill();
        g.beginPath(); g.ellipse(150, 175, 60, 45, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#111';
        g.beginPath(); g.arc(125, 135, 9, 0, Math.PI*2); g.arc(175, 135, 9, 0, Math.PI*2); g.fill();
        g.fillStyle = '#5d4037';
        g.beginPath(); g.arc(142, 170, 5, 0, Math.PI*2); g.arc(158, 170, 5, 0, Math.PI*2); g.fill();
        g.lineWidth = 4; g.strokeStyle = '#5d4037';
        g.beginPath(); g.arc(150, 178, 25, 0.2, Math.PI - 0.2); g.stroke();
      } else if (key === 't_rex') {
        // 티라노사우루스
        g.fillStyle = '#78281f'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#2e7d32';
        g.beginPath();
        g.moveTo(70, 200); g.quadraticCurveTo(50, 100, 160, 80);
        g.quadraticCurveTo(260, 75, 260, 140);
        g.quadraticCurveTo(260, 185, 180, 185);
        g.quadraticCurveTo(150, 190, 100, 240);
        g.closePath(); g.fill();
        // 눈
        g.fillStyle = '#f39c12'; g.beginPath(); g.arc(185, 110, 12, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(185, 110, 5, 0, Math.PI*2); g.fill();
        // 이빨
        g.fillStyle = '#fff';
        for(let x=150; x<250; x+=16) {
          g.beginPath(); g.moveTo(x, 150); g.lineTo(x+8, 168); g.lineTo(x+16, 150); g.fill();
        }
      } else if (key === 'trike') {
        // 트리케라톱스
        g.fillStyle = '#d35400'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#1e5f38';
        g.beginPath(); g.arc(150, 140, 100, 0, Math.PI*2); g.fill(); // 프릴
        g.fillStyle = '#2e7d32';
        g.beginPath(); g.ellipse(150, 170, 70, 60, 0, 0, Math.PI*2); g.fill(); // 코/얼굴
        // 뿔
        g.fillStyle = '#f5f6fa';
        g.beginPath(); g.moveTo(110, 130); g.lineTo(80, 50); g.lineTo(130, 115); g.fill();
        g.beginPath(); g.moveTo(190, 130); g.lineTo(220, 50); g.lineTo(170, 115); g.fill();
        g.beginPath(); g.moveTo(145, 190); g.lineTo(150, 145); g.lineTo(155, 190); g.fill();
        // 눈
        g.fillStyle = '#f1c40f';
        g.beginPath(); g.arc(115, 155, 9, 0, Math.PI*2); g.arc(185, 155, 9, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000';
        g.beginPath(); g.arc(115, 155, 5, 0, Math.PI*2); g.arc(185, 155, 5, 0, Math.PI*2); g.fill();
      } else if (key === 'pteranodon') {
        // 프테라노돈
        g.fillStyle = '#e67e22'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#c0392b';
        g.beginPath();
        g.moveTo(30, 170); g.lineTo(150, 90); g.lineTo(270, 170); g.lineTo(150, 135); g.closePath(); g.fill(); // 날개
        g.fillStyle = '#b71540';
        g.beginPath(); g.moveTo(150, 110); g.lineTo(240, 50); g.lineTo(160, 120); g.fill(); // 볏
        g.fillStyle = '#d35400';
        g.beginPath(); g.moveTo(140, 115); g.lineTo(70, 145); g.lineTo(145, 130); g.fill(); // 부리
        g.fillStyle = '#fff'; g.beginPath(); g.arc(145, 118, 6, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(145, 118, 3, 0, Math.PI*2); g.fill();
      } else if (key === 'dolphin') {
        // 돌고래
        g.fillStyle = '#00cec9'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#0984e3';
        g.beginPath();
        g.moveTo(40, 180); g.quadraticCurveTo(120, 60, 230, 120);
        g.quadraticCurveTo(270, 140, 250, 160);
        g.quadraticCurveTo(160, 195, 60, 185);
        g.closePath(); g.fill();
        g.beginPath(); g.moveTo(135, 90); g.lineTo(160, 50); g.lineTo(170, 100); g.fill(); // 등지느러미
        g.fillStyle = '#74b9ff';
        g.beginPath(); g.ellipse(150, 165, 65, 18, -0.2, 0, Math.PI*2); g.fill(); // 배
        g.fillStyle = '#fff'; g.beginPath(); g.arc(205, 128, 7, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(206, 128, 4, 0, Math.PI*2); g.fill();
      } else if (key === 'turtle') {
        // 바다거북
        g.fillStyle = '#0984e3'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#10ac84';
        g.beginPath(); g.ellipse(150, 150, 85, 65, 0, 0, Math.PI*2); g.fill(); // 등딱지
        g.fillStyle = '#1b8d6f';
        g.beginPath(); g.ellipse(150, 150, 70, 50, 0, 0, Math.PI*2); g.fill();
        g.fillStyle = '#2ed573';
        g.beginPath(); g.arc(235, 140, 22, 0, Math.PI*2); g.fill(); // 머리
        g.beginPath(); g.ellipse(180, 85, 38, 16, 0.5, 0, Math.PI*2); g.fill(); // 앞발
        g.beginPath(); g.ellipse(180, 215, 38, 16, -0.5, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(242, 135, 5, 0, Math.PI*2); g.fill();
      } else if (key === 'whale') {
        // 고래
        g.fillStyle = '#0c2461'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#1e3799';
        g.beginPath(); g.ellipse(140, 155, 110, 65, 0, 0, Math.PI*2); g.fill();
        g.beginPath(); g.moveTo(40, 155); g.lineTo(15, 110); g.lineTo(25, 155); g.lineTo(15, 200); g.fill(); // 꼬리
        g.fillStyle = '#4a69bd';
        g.beginPath(); g.ellipse(140, 175, 85, 30, 0, 0, Math.PI*2); g.fill(); // 배 주름
        g.fillStyle = '#fff'; g.beginPath(); g.arc(215, 145, 7, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(217, 145, 4, 0, Math.PI*2); g.fill();
      } else if (key === 'plesio') {
        // 플레시오사우루스
        g.fillStyle = '#1e3799'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#00cec9';
        g.beginPath(); g.ellipse(120, 175, 75, 45, 0, 0, Math.PI*2); g.fill(); // 몸
        g.beginPath();
        g.moveTo(155, 160); g.quadraticCurveTo(220, 130, 210, 70);
        g.quadraticCurveTo(230, 50, 245, 65);
        g.quadraticCurveTo(240, 100, 185, 175);
        g.closePath(); g.fill(); // 긴 목과 머리
        g.beginPath(); g.ellipse(100, 215, 35, 14, 0.4, 0, Math.PI*2); g.fill(); // 지느러미
        g.fillStyle = '#000'; g.beginPath(); g.arc(230, 62, 5, 0, Math.PI*2); g.fill();
      } else if (key === 'mosa') {
        // 모사사우루스
        g.fillStyle = '#182C61'; g.fillRect(0, 0, 300, 300);
        g.fillStyle = '#3B3B98';
        g.beginPath();
        g.moveTo(40, 150); g.quadraticCurveTo(130, 85, 260, 135);
        g.quadraticCurveTo(210, 195, 60, 165);
        g.closePath(); g.fill();
        // 입 & 이빨
        g.lineWidth = 3; g.strokeStyle = '#fff';
        g.beginPath(); g.moveTo(260, 135); g.lineTo(210, 130); g.stroke();
        g.fillStyle = '#fff';
        for(let x=215; x<255; x+=8) {
          g.beginPath(); g.moveTo(x, 130); g.lineTo(x+4, 138); g.lineTo(x+8, 130); g.fill();
        }
        g.fillStyle = '#f1c40f'; g.beginPath(); g.arc(220, 122, 6, 0, Math.PI*2); g.fill();
        g.fillStyle = '#000'; g.beginPath(); g.arc(220, 122, 3, 0, Math.PI*2); g.fill();
      }

      const url = off.toDataURL('image/png');
      generatedDataUrls[key] = url;
      const img = new Image();
      img.src = url;
      generatedImages[key] = img;
    }

    // 모든 크리처 이미지 사전 생성
    ['lion', 'giraffe', 'monkey', 't_rex', 'trike', 'pteranodon', 'dolphin', 'turtle', 'whale', 'plesio', 'mosa'].forEach(generateRealArtwork);

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (terrain && category) initHabitatAndEntities();
    }
    window.addEventListener('resize', resize);
    resize();

    function goToStart() {
      if (animId) cancelAnimationFrame(animId);
      document.getElementById('backBtn').style.display = 'none';
      canvas.style.display = 'none';
      document.getElementById('puzzleOverlay').style.display = 'none';
      document.getElementById('screen2').style.display = 'none';
      document.getElementById('screen1').style.display = 'flex';
      terrain = ''; category = '';
    }

    function selectTerrain(t) {
      terrain = t;
      document.getElementById('screen1').style.display = 'none';
      document.getElementById('screen2').style.display = 'flex';
      speak(t === 'land' ? '넓은 육지로 가요!' : '신비한 바다로 가요!');
    }

    function selectCategory(c) {
      category = c;
      document.getElementById('screen2').style.display = 'none';
      canvas.style.display = 'block';
      document.getElementById('backBtn').style.display = 'block';
      speak(c === 'animal' ? '동물들을 찾아봐요!' : '공룡을 찾아봐요!');
      initHabitatAndEntities();
      if (animId) cancelAnimationFrame(animId);
      gameLoop();
    }

    function initHabitatAndEntities() {
      const w = canvas.width, h = canvas.height;
      const zoneH = h / 3;

      if (terrain === 'land' && category === 'animal') {
        habitats = [
          { name: '🌾 사바나 초원 (기린)', grad: ['#e4c373', '#cf9b3a'], y: 0, h: zoneH },
          { name: '⛰️ 바위 언덕 (사자)', grad: ['#bcaaa4', '#8d6e63'], y: zoneH, h: zoneH },
          { name: '🌴 울창한 정글 (원숭이)', grad: ['#81c784', '#388e3c'], y: zoneH * 2, h: zoneH }
        ];
        entities = [
          { name: '기린', key: 'giraffe', x: w * 0.5, y: zoneH * 0.5, vx: 0.6, vy: 0.2, minX: 60, maxX: w - 60, minY: 60, maxY: zoneH - 60 },
          { name: '사자', key: 'lion', x: w * 0.4, y: zoneH * 1.5, vx: -0.5, vy: 0.3, minX: 60, maxX: w - 60, minY: zoneH + 60, maxY: zoneH * 2 - 60 },
          { name: '원숭이', key: 'monkey', x: w * 0.6, y: zoneH * 2.5, vx: 0.8, vy: -0.4, minX: 60, maxX: w - 60, minY: zoneH * 2 + 60, maxY: h - 60 }
        ];
      } else if (terrain === 'land' && category === 'dino') {
        habitats = [
          { name: '🌋 화산 상공 (프테라노돈)', grad: ['#e17055', '#d63031'], y: 0, h: zoneH },
          { name: '🌲 백악기 숲 (티라노사우루스)', grad: ['#2ed573', '#1e8449'], y: zoneH, h: zoneH },
          { name: '🏜️ 붉은 평원 (트리케라톱스)', grad: ['#e58e26', '#b71540'], y: zoneH * 2, h: zoneH }
        ];
        entities = [
          { name: '프테라노돈', key: 'pteranodon', x: w * 0.3, y: zoneH * 0.5, vx: 0.9, vy: 0.3, minX: 60, maxX: w - 60, minY: 60, maxY: zoneH - 60 },
          { name: '티라노사우루스', key: 't_rex', x: w * 0.5, y: zoneH * 1.5, vx: -0.6, vy: 0.2, minX: 60, maxX: w - 60, minY: zoneH + 60, maxY: zoneH * 2 - 60 },
          { name: '트리케라톱스', key: 'trike', x: w * 0.7, y: zoneH * 2.5, vx: 0.5, vy: -0.3, minX: 60, maxX: w - 60, minY: zoneH * 2 + 60, maxY: h - 60 }
        ];
      } else if (terrain === 'sea' && category === 'animal') {
        habitats = [
          { name: '🏖️ 맑은 산호초 (돌고래)', grad: ['#74b9ff', '#0984e3'], y: 0, h: zoneH },
          { name: '🌊 푸른 바다 (바다거북)', grad: ['#00cec9', '#0097e6'], y: zoneH, h: zoneH },
          { name: '🌌 깊은 심해 (고래)', grad: ['#192a56', '#0c2461'], y: zoneH * 2, h: zoneH }
        ];
        entities = [
          { name: '돌고래', key: 'dolphin', x: w * 0.3, y: zoneH * 0.5, vx: 0.8, vy: 0.3, minX: 60, maxX: w - 60, minY: 60, maxY: zoneH - 60 },
          { name: '바다거북', key: 'turtle', x: w * 0.7, y: zoneH * 1.5, vx: -0.4, vy: 0.2, minX: 60, maxX: w - 60, minY: zoneH + 60, maxY: zoneH * 2 - 60 },
          { name: '고래', key: 'whale', x: w * 0.5, y: zoneH * 2.5, vx: 0.6, vy: -0.2, minX: 60, maxX: w - 60, minY: zoneH * 2 + 60, maxY: h - 60 }
        ];
      } else {
        habitats = [
          { name: '☀️ 얕은 고대 바다 (플레시오사우루스)', grad: ['#00d2d3', '#2e86de'], y: 0, h: zoneH * 1.5 },
          { name: '🌑 깊은 해저 계곡 (모사사우루스)', grad: ['#2e86de', '#0c2461'], y: zoneH * 1.5, h: zoneH * 1.5 }
        ];
        entities = [
          { name: '플레시오사우루스', key: 'plesio', x: w * 0.4, y: zoneH * 0.75, vx: 0.7, vy: 0.3, minX: 60, maxX: w - 60, minY: 60, maxY: zoneH * 1.5 - 60 },
          { name: '모사사우루스', key: 'mosa', x: w * 0.6, y: zoneH * 2.2, vx: -0.7, vy: -0.3, minX: 60, maxX: w - 60, minY: zoneH * 1.5 + 60, maxY: h - 60 }
        ];
      }
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      habitats.forEach(hab => {
        const grd = ctx.createLinearGradient(0, hab.y, 0, hab.y + hab.h);
        grd.addColorStop(0, hab.grad[0]);
        grd.addColorStop(1, hab.grad[1]);
        ctx.fillStyle = grd;
        ctx.fillRect(0, hab.y, canvas.width, hab.h);

        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, hab.y);
        ctx.lineTo(canvas.width, hab.y);
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.font = 'bold 18px Apple SD Gothic Neo, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(hab.name, 20, hab.y + 32);
        ctx.shadowBlur = 0;
      });

      entities.forEach(e => {
        e.x += e.vx;
        e.y += e.vy;

        if (e.x < e.minX || e.x > e.maxX) e.vx *= -1;
        if (e.y < e.minY || e.y > e.maxY) e.vy *= -1;

        const img = generatedImages[e.key];
        const r = 48;

        ctx.save();
        ctx.beginPath();
        ctx.arc(e.x, e.y, r, 0, Math.PI * 2);
        ctx.closePath();

        ctx.lineWidth = 4;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        ctx.clip();

        if (img) {
          ctx.drawImage(img, e.x - r, e.y - r, r * 2, r * 2);
        }
        ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px Apple SD Gothic Neo, sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(e.name, e.x, e.y + r + 20);
        ctx.shadowBlur = 0;
      });

      animId = requestAnimationFrame(gameLoop);
    }

    canvas.addEventListener('pointerdown', (evt) => {
      const rect = canvas.getBoundingClientRect();
      const clickX = evt.clientX - rect.left;
      const clickY = evt.clientY - rect.top;

      entities.forEach(e => {
        const dist = Math.hypot(e.x - clickX, e.y - clickY);
        if (dist < 60) {
          openDragPuzzle(e);
        }
      });
    });

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }
    }

    function closePuzzle() {
      document.getElementById('puzzleOverlay').style.display = 'none';
      currentSelected = null;
    }

    let positions = [];
    let isDragging = false;
    let dragEl = null;
    let dragSlotIdx = -1;
    let startX = 0, startY = 0, origLeft = 0, origTop = 0;

    function openDragPuzzle(entity) {
      currentSelected = entity;
      speak(`이 동물은 ${entity.name}! 퍼즐을 손으로 끌어서 맞춰봐요!`);
      document.getElementById('puzzleTitle').innerText = `${entity.name} 맞추기`;
      document.getElementById('puzzleCompleteMsg').style.display = 'none';
      document.getElementById('puzzleOverlay').style.display = 'flex';

      positions = [0, 1, 2, 3, 4, 5, 6, 7, 8];
      shuffle(positions);
      renderDragBoard();
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      if (arr.every((val, idx) => val === idx)) {
        [arr[0], arr[1]] = [arr[1], arr[0]];
      }
    }

    function getSlotXY(slotIdx) {
      const col = slotIdx % 3;
      const row = Math.floor(slotIdx / 3);
      return { x: col * 102, y: row * 102 };
    }

    function renderDragBoard() {
      const board = document.getElementById('puzzleBoard');
      board.innerHTML = '';
      const photoUrl = generatedDataUrls[currentSelected.key];

      for (let slot = 0; slot < 9; slot++) {
        const tileId = positions[slot];
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.slot = slot;
        tile.dataset.tileId = tileId;

        const origCol = tileId % 3;
        const origRow = Math.floor(tileId / 3);
        tile.style.backgroundImage = `url("${photoUrl}")`;
        tile.style.backgroundPosition = `-${origCol * 100}px -${origRow * 100}px`;

        const pos = getSlotXY(slot);
        tile.style.left = `${pos.x}px`;
        tile.style.top = `${pos.y}px`;

        tile.addEventListener('pointerdown', onPointerDown);
        board.appendChild(tile);
      }
    }

    function onPointerDown(e) {
      if (isDragging) return;
      isDragging = true;
      dragEl = e.currentTarget;
      dragSlotIdx = parseInt(dragEl.dataset.slot, 10);

      startX = e.clientX;
      startY = e.clientY;
      origLeft = parseFloat(dragEl.style.left);
      origTop = parseFloat(dragEl.style.top);

      dragEl.classList.add('dragging');
      dragEl.setPointerCapture(e.pointerId);

      dragEl.addEventListener('pointermove', onPointerMove);
      dragEl.addEventListener('pointerup', onPointerUp);
      dragEl.addEventListener('pointercancel', onPointerUp);
    }

    function onPointerMove(e) {
      if (!isDragging || !dragEl) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      dragEl.style.left = `${origLeft + dx}px`;
      dragEl.style.top = `${origTop + dy}px`;
    }

    function onPointerUp(e) {
      if (!isDragging || !dragEl) return;

      dragEl.removeEventListener('pointermove', onPointerMove);
      dragEl.removeEventListener('pointerup', onPointerUp);
      dragEl.removeEventListener('pointercancel', onPointerUp);
      dragEl.releasePointerCapture(e.pointerId);

      const boardRect = document.getElementById('puzzleBoard').getBoundingClientRect();
      const dropX = e.clientX - boardRect.left;
      const dropY = e.clientY - boardRect.top;

      let targetSlot = -1;
      if (dropX >= 0 && dropX <= 306 && dropY >= 0 && dropY <= 306) {
        const col = Math.min(2, Math.max(0, Math.floor(dropX / 102)));
        const row = Math.min(2, Math.max(0, Math.floor(dropY / 102)));
        targetSlot = row * 3 + col;
      }

      dragEl.classList.remove('dragging');

      if (targetSlot !== -1 && targetSlot !== dragSlotIdx) {
        const otherEl = document.querySelector(`.tile[data-slot="${targetSlot}"]`);
        
        const temp = positions[dragSlotIdx];
        positions[dragSlotIdx] = positions[targetSlot];
        positions[targetSlot] = temp;

        dragEl.dataset.slot = targetSlot;
        otherEl.dataset.slot = dragSlotIdx;

        const newTargetPos = getSlotXY(targetSlot);
        const newOriginPos = getSlotXY(dragSlotIdx);

        dragEl.style.left = `${newTargetPos.x}px`;
        dragEl.style.top = `${newTargetPos.y}px`;
        otherEl.style.left = `${newOriginPos.x}px`;
        otherEl.style.top = `${newOriginPos.y}px`;

        checkComplete();
      } else {
        dragEl.style.left = `${origLeft}px`;
        dragEl.style.top = `${origTop}px`;
      }

      isDragging = false;
      dragEl = null;
    }

    function checkComplete() {
      const isDone = positions.every((val, idx) => val === idx);
      if (isDone) {
        speak(`정답! 멋진 ${currentSelected.name} 완성! 참 잘했어요!`);
        document.getElementById('puzzleCompleteMsg').style.display = 'block';
        setTimeout(() => {
          document.getElementById('puzzleOverlay').style.display = 'none';
        }, 2200);
      }
    }
  </script>
</body>
