<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>미니 동물 & 공룡 AR 도감</title>
  
  <!-- [필수] 구글 model-viewer 최신 스크립트 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body {
      margin: 0; padding: 0; background: #e0f7fa; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      overflow-x: hidden; text-align: center; color: #006064;
    }

    header {
      position: sticky; top: 0; background: #ffffff; padding: 12px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.05); z-index: 30;
    }
    h1 { font-size: 1.3rem; margin: 0; font-weight: 800; }

    .grid-container {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px; padding: 15px; max-width: 700px; margin: 0 auto;
    }
    .card {
      background: #ffffff; border-radius: 20px; padding: 14px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06); cursor: pointer;
      border: 3px solid transparent; transition: transform 0.15s;
    }
    .card:active { transform: scale(0.95); }

    .card-img-wrap {
      width: 100px; height: 100px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; background: #b2ebf2;
    }
    .card-name { font-size: 1.15rem; font-weight: 800; margin-top: 10px; }

    /* 3D & AR 오버레이 */
    #actionOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.92); z-index: 100; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
    }
    #closeOverlayBtn {
      position: absolute; top: 20px; right: 20px; font-size: 1.1rem;
      padding: 8px 18px; border-radius: 20px; border: none;
      background: #ff5252; color: white; font-weight: bold; cursor: pointer;
    }

    .view-panel {
      width: 100%; max-width: 350px; background: #ffffff; border-radius: 25px;
      padding: 18px; display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    #actionTitle { font-size: 1.7rem; margin: 0 0 5px 0; color: #212121; font-weight: bold; }
    #actionDesc { font-size: 0.95rem; margin: 0 0 12px 0; color: #757575; max-width: 280px; }

    model-viewer {
      width: 100%; height: 250px; background: #e0f7fa; border-radius: 18px;
      --poster-color: transparent; border: 2px solid #b2ebf2;
    }

    /* 포켓몬GO 스타일 소환 버튼 */
    .ar-custom-btn {
      margin-top: 15px; font-size: 1.25rem; font-weight: bold;
      padding: 16px 22px; border-radius: 25px; border: none;
      background: linear-gradient(135deg, #00acc1, #00e5ff);
      color: #ffffff; cursor: pointer; width: 100%; max-width: 280px;
      box-shadow: 0 4px 12px rgba(0, 172, 193, 0.4);
    }
    .ar-custom-btn:active { transform: scale(0.96); }

    .puzzle-btn {
      font-size: 1.1rem; font-weight: bold; padding: 13px 20px; border: none; border-radius: 22px;
      background: #ff9800; color: white; cursor: pointer; margin-top: 10px; width: 100%; max-width: 280px;
      box-shadow: 0 3px 8px rgba(255, 152, 0, 0.3);
    }
    .puzzle-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <header>
    <h1>방에 소환! 미니 AR 도감</h1>
  </header>

  <main class="grid-container">
    <div class="card" onclick="openActionPanel('astronaut')">
      <div class="card-img-wrap">👨‍🚀</div>
      <div class="card-name">우주비행사</div>
    </div>
    <div class="card" onclick="openActionPanel('chair')">
      <div class="card-img-wrap">🪑</div>
      <div class="card-name">빨간 의자</div>
    </div>
    <div class="card" onclick="openActionPanel('mixer')">
      <div class="card-img-wrap">🍹</div>
      <div class="card-name">음료 믹서기</div>
    </div>
  </main>

  <!-- AR/퍼즐 선택 창 -->
  <div id="actionOverlay">
    <button id="closeOverlayBtn" onclick="closeOverlay()">✕ 닫기</button>
    
    <div class="view-panel">
      <h2 id="actionTitle">이름</h2>
      <p id="actionDesc"></p>

      <!-- 아이폰(USDZ)과 안드로이드(GLB) 모두 지원하는 뷰어 -->
      <model-viewer id="viewer" 
                    camera-controls touch-action="pan-y"
                    autoplay animation-name="*"
                    ar ar-modes="webxr scene-viewer quick-look" 
                    ar-scale="auto" ar-placement="floor"
                    exposure="1.0" shadow-intensity="1" 
                    interaction-prompt="none"
                    src="" ios-src="">
        
        <!-- model-viewer 내장 AR 트리거 슬롯 버튼 -->
        <button slot="ar-button" id="realArBtn" style="display: none;"></button>
      </model-viewer>

      <!-- 포켓몬GO 소환 버튼 (클릭 시 브라우저 AR 엔진 호출) -->
      <button class="ar-custom-btn" onclick="triggerAR()">📱 포켓몬GO처럼 소환!</button>
      <button class="puzzle-btn" onclick="speak('퍼즐 놀이를 시작해요!')">🧩 3x3 퍼즐 맞추기</button>
    </div>
  </div>

  <script>
    // 아이폰(.usdz)과 안드로이드(.glb) 파일이 모두 완벽하게 준비된 고화질 3D 샘플 데이터
    const CREATURE_AR_DATA = {
      astronaut: {
        name: '우주비행사',
        desc: '멋진 우주복을 입은 우주비행사 친구예요!',
        glb: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
        usdz: 'https://modelviewer.dev/shared-assets/models/Astronaut.usdz'
      },
      chair: {
        name: '빨간 의자',
        desc: '방바닥에 쏙 들어가는 미니 의자예요!',
        glb: 'https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/SheenChair/glTF-Binary/SheenChair.glb',
        usdz: 'https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/SheenChair/glTF-Binary/SheenChair.usdz'
      },
      mixer: {
        name: '음료 믹서기',
        desc: '빙글빙글 돌아가는 재미있는 믹서기예요!',
        glb: 'https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/BarramundiFish/glTF-Binary/BarramundiFish.glb',
        usdz: 'https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/BarramundiFish/glTF-Binary/BarramundiFish.usdz'
      }
    };

    function openActionPanel(id) {
      const item = CREATURE_AR_DATA[id];
      
      document.getElementById('actionTitle').innerText = item.name;
      document.getElementById('actionDesc').innerText = item.desc;
      speak(`${item.name}! ${item.desc}`);

      const viewer = document.getElementById('viewer');
      viewer.src = item.glb;
      viewer.setAttribute('ios-src', item.usdz);

      document.getElementById('actionOverlay').style.display = 'flex';
    }

    function triggerAR() {
      const viewer = document.getElementById('viewer');
      if (viewer.canActivateAR) {
        viewer.activateAR();
      } else {
        // model-viewer 내장 AR 버튼 강제 트리거
        const realBtn = document.getElementById('realArBtn');
        if (realBtn) realBtn.click();
      }
    }

    function closeOverlay() {
      document.getElementById('actionOverlay').style.display = 'none';
      const viewer = document.getElementById('viewer');
      viewer.src = '';
      viewer.removeAttribute('ios-src');
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR'; msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
      }
    }
  </script>
</body>
</html>
